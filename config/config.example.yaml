# 微信公众号评论区自动引流与神评生成系统配置

# 1. 自身公众号定位与引流受众画像
my_account:
  name: "你的公众号名称"
  domain_tags:
    - "AI人工智能"
    - "自动化效率工具"
    - "副业成长与商业变现"
  target_audience_description: "对前沿AI应用、自动化脚本、工作流提效、独立开发以及自媒体创业感兴趣的年轻人和知识工作者。"
  tone_style: "专业严谨、洞见深刻、兼具幽默金句感，绝不发硬广"

# 2. 定向监控对标大号列表 (优先级 1：第一时间抢占首发15分钟内前排留言)
monitored_accounts:
  - name: "对标大号A"
    biz_id: "MzI1XXXXXX=="
    priority: "high"
  - name: "行业前沿快讯"
    biz_id: "MzA4XXXXXX=="
    priority: "medium"

# 3. 第三方行业数据平台配置 (优先级 2：监测全行业上升期爆文)
third_party_api:
  enabled: true
  provider: "newrank" # 可选: newrank (新榜), xigua (西瓜数据), qingbo (清博)
  endpoint: "https://api.newrank.cn/v1/articles/hot"
  api_key: "your-third-party-api-key"
  category: "科技互联网"

# 4. 监控与筛选阈值设置
evaluation_rules:
  # 受众重叠度最低得分 (0 - 100)
  min_audience_relevance_score: 70
  # 最小预估热度门槛
  min_estimated_heat: "medium"
  # 允许发表评论的最大发布延迟（分钟，超过30分钟的文章不建议再去抢前排评论）
  max_publish_delay_minutes: 30
  # 必须包含的行业相关关键词 (任意命中其一)
  required_keywords:
    - "AI"
    - "自动化"
    - "工具"
    - "大模型"
    - "效率"
    - "创业"
  # 过滤黑名单关键词 (若文章包含以下词汇则直接跳过，避免敏感与争议)
  blacklist_keywords:
    - "政治"
    - "维权"
    - "医疗事故"
    - "投资暴富"

# 5. LLM 留言生成模型配置
llm:
  provider: "openai" # 支持 openai, deepseek, moonshot 等兼容接口
  base_url: "https://api.deepseek.com/v1" # 或 https://api.openai.com/v1
  api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
  model: "deepseek-chat" # 或 gpt-4o, gpt-4o-mini
  temperature: 0.7
  candidate_count: 3

# 6. 执行模式设置
execution:
  # 当前策略: "copilot" (智能副驾模式：零封号风险，推送到飞书/企微/移动端一键确认发表)
  mode: "copilot"
  
  # 每日最大提醒推送上限
  max_daily_comments: 20
  # 最小推送间隔（秒）
  min_interval_seconds: 120

# 7. 通知渠道 (用于 Copilot 模式将候选神评推送到移动端一键复制或审核)
notifications:
  feishu_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxx"
  wechat_work_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxx"
  serverchan_sendkey: ""
